name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visiontrack-ftp-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via Python FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          python3 <<'PY'
          import ftplib, os, sys, socket
          from pathlib import Path

          def err(msg: str) -> None:
              print(f"::error::{msg}")
              print(msg, file=sys.stderr)

          def notice(msg: str) -> None:
              print(f"::notice::{msg}")
              print(msg)

          server_raw = (os.environ.get("FTP_SERVER") or "").strip()
          user = (os.environ.get("FTP_USERNAME") or "").strip()
          password = (os.environ.get("FTP_PASSWORD") or "").strip()
          port_raw = (os.environ.get("FTP_PORT") or "21").strip() or "21"

          for label, value in [("FTP_SERVER", server_raw), ("FTP_USERNAME", user), ("FTP_PASSWORD", password)]:
              if not value:
                  err(f"{label} secret is empty")
                  sys.exit(1)

          server = server_raw.replace("ftp://", "").replace("ftps://", "").split("/")[0]
          if ":" in server and server.count(":") == 1:
              host, maybe_port = server.split(":", 1)
              if maybe_port.isdigit():
                  server, port_raw = host, maybe_port
          port = int(port_raw)

          notice(f"Secret lengths server={len(server_raw)} user={len(user)} password={len(password)} port={port}")
          ips = socket.getaddrinfo(server, port, proto=socket.IPPROTO_TCP)
          notice(f"DNS OK: {[i[4][0] for i in ips[:3]]}")

          ftp = ftplib.FTP()
          ftp.connect(server, port, timeout=30)
          ftp.login(user, password)
          ftp.set_pasv(True)
          notice("FTP login OK (credentials accepted)")

          # Broken home dir (/www missing) is common on this host.
          # Try known web roots without relying on PWD first.
          candidates = [
              "/",
              "/public_html",
              "/www",
              "/home/" + user,
              "/home/" + user + "/www",
              "/home/" + user + "/public_html",
              "public_html",
              "www",
              ".",
          ]
          landed = None
          for candidate in candidates:
              try:
                  ftp.cwd(candidate)
                  landed = candidate
                  notice(f"cwd OK: {candidate}")
                  break
              except Exception as e:
                  notice(f"cwd failed {candidate}: {e}")

          if landed is None:
              err(
                  "FTP login worked but no usable directory. "
                  "Hosting FTP home is likely set to /www which does not exist. "
                  "In the hosting panel, set the FTP account home to an existing web root "
                  "(public_html or www), then re-run."
              )
              sys.exit(1)

          try:
              web_root = ftp.pwd()
          except Exception as e:
              web_root = landed
              notice(f"pwd still failing ({e}); using landed path {landed}")
          notice(f"Uploading into: {web_root}")

          try:
              listing = ftp.nlst()
              notice(f"Listing: {listing}")
          except Exception as e:
              notice(f"nlst failed: {e}")

          def chdir_web() -> None:
              ftp.cwd(web_root if web_root.startswith("/") else landed)

          def ensure_dir(remote_dir: str) -> None:
              parts = [p for p in remote_dir.replace("\\", "/").split("/") if p and p != "."]
              chdir_web()
              for part in parts:
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      try:
                          ftp.mkd(part)
                          notice(f"Created dir {part}")
                      except ftplib.error_perm as e:
                          err(f"mkd failed for '{part}': {e}")
                          raise
                      ftp.cwd(part)

          skip_tops = {".git", ".github"}
          skip_files = {".gitignore", "README.md"}
          root = Path(".").resolve()
          uploaded = 0

          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              parts = Path(rel).parts
              if parts and parts[0] in skip_tops:
                  continue
              if path.name in skip_files:
                  continue

              parent = str(Path(rel).parent).replace("\\", "/")
              try:
                  if parent in ("", "."):
                      chdir_web()
                  else:
                      ensure_dir(parent)
                  with path.open("rb") as fh:
                      ftp.storbinary(f"STOR {path.name}", fh)
                  uploaded += 1
                  print(f"Uploaded {rel}")
              except Exception as e:
                  err(f"Failed uploading {rel}: {type(e).__name__}: {e}")
                  raise

          notice(f"Done. uploaded={uploaded} files")
          try:
              ftp.quit()
          except Exception:
              ftp.close()
          PY
