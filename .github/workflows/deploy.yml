name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visiontrack-ftp-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

          python3 <<'PY'
          import os, shlex, subprocess, sys

          def notice(msg: str) -> None:
              print(f"::notice::{msg}")
              print(msg)

          def err(msg: str) -> None:
              print(f"::error::{msg}")
              print(msg, file=sys.stderr)

          server = (os.environ.get("FTP_SERVER") or "").strip()
          user = (os.environ.get("FTP_USERNAME") or "").strip()
          password = (os.environ.get("FTP_PASSWORD") or "").strip()
          for label, value in [("FTP_SERVER", server), ("FTP_USERNAME", user), ("FTP_PASSWORD", password)]:
              if not value:
                  err(f"{label} secret is empty")
                  sys.exit(1)

          server = server.replace("ftp://", "").replace("sftp://", "").replace("ftps://", "").split("/")[0].split(":")[0]
          os.environ["SSHPASS"] = password
          ssh_base = [
              "sshpass", "-e", "ssh",
              "-o", "StrictHostKeyChecking=no",
              "-o", "UserKnownHostsFile=/dev/null",
              "-o", "PreferredAuthentications=password",
              "-o", "PubkeyAuthentication=no",
              "-p", "22",
              f"{user}@{server}",
          ]

          notice(f"SFTP/SSH connect {user}@{server}:22")
          probe = subprocess.run(
              ssh_base + ["pwd; ls -la; if [ -d www ]; then echo HAS_WWW=1; else echo HAS_WWW=0; fi"],
              capture_output=True, text=True
          )
          print(probe.stdout)
          print(probe.stderr)
          if probe.returncode != 0:
              err(
                  "SSH/SFTP login failed. In Cafe24 click FTP/SSH 접속설정 > 설정하기 "
                  "and allow overseas IPs, then confirm the password matches GitHub FTP_PASSWORD."
              )
              sys.exit(probe.returncode)

          remote = "www/" if "HAS_WWW=1" in (probe.stdout or "") else "./"
          notice(f"Upload target: {remote}")

          rsync = [
              "sshpass", "-e", "rsync", "-avz", "--delete",
              "--exclude", ".git",
              "--exclude", ".github",
              "--exclude", ".gitignore",
              "--exclude", "README.md",
              "-e", "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 22",
              "./",
              f"{user}@{server}:{remote}",
          ]
          result = subprocess.run(rsync, capture_output=True, text=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              err(f"rsync failed: {result.stderr.strip() or result.stdout.strip()}")
              sys.exit(result.returncode)
          notice("SFTP deploy finished")
          PY
