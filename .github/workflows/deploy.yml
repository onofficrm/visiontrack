name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visiontrack-ftp-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ./
          server-dir: /public_html/
          state-name: visiontrack-deploy-v3
          log-level: standard
          exclude: |
            .git
            .git/**
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            **/.vscode/**
            **/._*
            README.md
            _backup_transfer_*/
            **/_backup_transfer_*/
            data/**
            cache/**
            session/**
            tmp/**
            *.log
            .env
            .env.*
