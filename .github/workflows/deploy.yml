name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: visiontrack-ftp-deploy
  cancel-in-progress: true

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SCP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

          SERVER="$(echo "$FTP_SERVER" | sed -E 's#^(s?ftp|ftps)://##; s#/.*##; s#:.*##')"
          USER="$FTP_USERNAME"
          export SSHPASS="$FTP_PASSWORD"

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no"

          echo "::notice::SSH connect ${USER}@${SERVER}:22"
          OUT="$(sshpass -e ssh $SSH_OPTS -p 22 "${USER}@${SERVER}" 'pwd; ls -la; if [ -d www ]; then echo HAS_WWW=1; else echo HAS_WWW=0; fi')"
          echo "$OUT"

          if echo "$OUT" | grep -q 'HAS_WWW=1'; then
            REMOTE="www"
          else
            REMOTE="."
          fi
          echo "::notice::Upload target: ${REMOTE}/"

          # Stage clean upload tree
          rm -rf /tmp/deploy-upload
          mkdir -p /tmp/deploy-upload
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude '.DS_Store' \
            ./ /tmp/deploy-upload/

          # Upload contents into remote www (or home)
          sshpass -e scp $SSH_OPTS -P 22 -r /tmp/deploy-upload/. "${USER}@${SERVER}:${REMOTE}/"

          echo "::notice::Remote listing after upload"
          sshpass -e ssh $SSH_OPTS -p 22 "${USER}@${SERVER}" "ls -la ${REMOTE} | head -40"
          echo "::notice::SCP deploy finished"
